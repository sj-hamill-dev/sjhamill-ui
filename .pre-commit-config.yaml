# Mirrors the CI validate job so failures show up before push.
# Install once per clone:
#   pip install pre-commit
#   pre-commit install

repos:
  - repo: local
    hooks:
      - id: typecheck
        name: tsc --noEmit
        entry: npm run build
        language: system
        pass_filenames: false
        types_or: [ts, tsx]

      - id: eslint
        name: eslint
        entry: npm run lint
        language: system
        pass_filenames: false
        types_or: [ts, tsx]

      - id: prettier
        name: prettier --check
        entry: npm run format:check
        language: system
        pass_filenames: false
